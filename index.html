    <script>
      // 1. Silent stub for Vite dev-server HMR WebSockets in sandbox/iframe preview environments
      // (External WebSocket ports are blocked/closed in iframe proxies, while HMR is disabled in AI Studio)
      (function() {
        if (typeof window === 'undefined') return;

        var isIgnored = function(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || msg.toString() || '');
          return str.includes('[vite] failed to connect to websocket') ||
                 str.includes('WebSocket closed without opened') ||
                 str.includes('Could not reach Cloud Firestore backend') ||
                 str.includes("Backend didn't respond within 10 seconds");
        };

        // Suppress console.error for expected websocket & offline heuristic diagnostics
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isIgnored(arguments[i])) return;
          }
          return origConsoleError.apply(console, arguments);
        };

        // Catch and prevent unhandled promise rejections & global error events
        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnored(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isIgnored(event.message) || isIgnored(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Intercept Vite HMR WebSocket so it stays silently open without failing
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr =
              (typeof protocols === 'string' && protocols === 'vite-hmr') ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('token=') !== -1 && url.indexOf('vite') !== -1));

            if (isViteHmr) {
              var listeners = {};
              var mockWs = {
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1,
                url: url,
                protocol: 'vite-hmr',
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      if (mockWs.readyState === 1) {
                        try { fn({ type: 'open', target: mockWs }); } catch (e) {}
                      }
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {
                  mockWs.readyState = 3;
                  if (listeners['close']) {
                    listeners['close'].forEach(function(fn) {
                      try { fn({ type: 'close', wasClean: true, code: 1000, target: mockWs }); } catch (e) {}
                    });
                  }
                }
              };
              return mockWs;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
